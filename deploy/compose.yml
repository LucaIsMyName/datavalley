# Context is the release root. This file lives in deploy/.
name: datavalley

services:
  postgres:
    image: postgres:16
    profiles: [bundled-db]
    restart: unless-stopped
    env_file:
      - ${DATAVALLEY_ENV_FILE:?}
    volumes:
      - datavalley_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    profiles: [bundled-redis]
    restart: unless-stopped
    env_file:
      - ${DATAVALLEY_ENV_FILE:?}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes
    volumes:
      - datavalley_redis:/data

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
    image: datavalley-app:${RELEASE_STAMP:?}
    env_file:
      - ${DATAVALLEY_ENV_FILE:?}
    environment:
      API_HOST: 0.0.0.0
      MEDIA_ROOT: /var/lib/datavalley/media
    # Root only for the chown: media volumes created by releases that ran as root must become writable for the
    # unprivileged api and worker containers.
    user: root
    command: ["sh", "-c", "chown -R node:node /var/lib/datavalley/media && npm run migrate && npm run seed:admin"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    volumes:
      - datavalley_media:/var/lib/datavalley/media

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
    image: datavalley-app:${RELEASE_STAMP:?}
    env_file:
      - ${DATAVALLEY_ENV_FILE:?}
    environment:
      API_HOST: 0.0.0.0
      MEDIA_ROOT: /var/lib/datavalley/media
    command: ["npm", "run", "start", "-w", "@datavalley/api"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_started
        required: false
    volumes:
      - datavalley_media:/var/lib/datavalley/media

  worker:
    profiles: [worker]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
    image: datavalley-app:${RELEASE_STAMP:?}
    env_file:
      - ${DATAVALLEY_ENV_FILE:?}
    environment:
      API_HOST: 0.0.0.0
      MEDIA_ROOT: /var/lib/datavalley/media
    command: ["npm", "run", "start", "-w", "@datavalley/worker"]
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
        required: false
    volumes:
      - datavalley_media:/var/lib/datavalley/media

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    image: datavalley-web:${RELEASE_STAMP:?}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?}
      API_PORT: ${API_PORT:-3000}
      ACME_EMAIL: ${INITIAL_ADMIN_EMAIL:?}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - datavalley_caddy:/data
      - datavalley_caddy_config:/config

volumes:
  datavalley_postgres:
    name: datavalley_postgres
  datavalley_redis:
    name: datavalley_redis
  datavalley_media:
    name: datavalley_media
  datavalley_caddy:
    name: datavalley_caddy
  datavalley_caddy_config:
    name: datavalley_caddy_config
